// ==================== 효과음 (Web Audio API) ====================
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'stone') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(95, now + 0.08);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === 'hit') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(580, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.1);
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'fall') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.linearRampToValueAtTime(75, now + 0.28);
    gain.gain.setValueAtTime(0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    osc.start(now); osc.stop(now + 0.28);
  } else if (type === 'win') {
    [523, 659, 784, 1046].forEach((f, idx) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, now + idx * 0.1);
      g.gain.setValueAtTime(0.16, now + idx * 0.1);
      g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.25);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now + idx * 0.1); o.stop(now + idx * 0.1 + 0.25);
    });
  } else if (type === 'lose') {
    [330, 294, 262, 196].forEach((f, idx) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, now + idx * 0.12);
      g.gain.setValueAtTime(0.12, now + idx * 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.25);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now + idx * 0.12); o.stop(now + idx * 0.12 + 0.25);
    });
  }
}

let currentMode = 'omok';
let currentChar = CHARACTERS[0];
let gameEnded = false;

const canvas = document.getElementById('boardCanvas');
const ctx = canvas.getContext('2d');

function goScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function selectGameMode(mode) {
  currentMode = mode;
  const modeNames = { alkkagi: '🎯 알까기', baduk: '⚫⚪ 바둑 (9×9)', omok: '⭕❌ 오목 (15×15)' };
  document.getElementById('selected-mode-badge').textContent = `종목: ${modeNames[mode]}`;
  renderCharacterSelect();
  goScreen('screen-select');
}

function renderCharacterSelect() {
  const container = document.getElementById('character-tiers');
  container.innerHTML = '';
  const tiers = [
    { tier: 1, title: '🌱 매우 쉬움 (입문)' },
    { tier: 2, title: '🌿 쉬움 (초급)' },
    { tier: 3, title: '🔥 보통 (중급)' },
    { tier: 4, title: '⚡ 어려움 (고수)' },
    { tier: 5, title: '👑 매우 어려움 (최종 보스)' }
  ];

  tiers.forEach(t => {
    const sec = document.createElement('div');
    sec.className = 'tier-section';
    const chars = CHARACTERS.filter(c => c.tier === t.tier);
    sec.innerHTML = `<div class="tier-label ${chars[0].tierClass}">${t.title}</div>`;
    const row = document.createElement('div');
    row.className = 'char-row';
    chars.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'char-btn';
      btn.innerHTML = `
        <span class="char-emoji">${c.emoji}</span>
        <div>
          <div class="char-info-name">${c.name}</div>
          <div class="char-info-quote">${c.preview}</div>
        </div>
      `;
      btn.onclick = () => startMatch(c);
      row.appendChild(btn);
    });
    sec.appendChild(row);
    container.appendChild(sec);
  });
}

function setSpeech(text) {
  document.getElementById('opp-speech').textContent = text;
}
function randomQuote(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function startMatch(charObj) {
  currentChar = charObj;
  gameEnded = false;
  document.getElementById('result-modal').classList.remove('show');
  document.getElementById('opp-avatar').textContent = charObj.emoji;
  document.getElementById('opp-name').textContent = charObj.name;
  document.getElementById('opp-tier').textContent = charObj.tierName;
  setSpeech(charObj.quotes.start);

  const modeTitles = { alkkagi: '🎯 알까기 대결', baduk: '⚫⚪ 바둑 대결 (9×9)', omok: '⭕❌ 오목 대결' };
  document.getElementById('game-header-title').textContent = modeTitles[currentMode];

  goScreen('screen-game');
  if (currentMode === 'omok') initOmok();
  else if (currentMode === 'baduk') initBaduk();
  else if (currentMode === 'alkkagi') initAlkkagi();
}

function restartMatch() {
  startMatch(currentChar);
}

function closeModalToSelect() {
  document.getElementById('result-modal').classList.remove('show');
  goScreen('screen-select');
}

function showResult(isWin, customDesc) {
  if (gameEnded) return;
  gameEnded = true;
  playSound(isWin ? 'win' : 'lose');
  setSpeech(isWin ? currentChar.quotes.lose : currentChar.quotes.win);

  document.getElementById('modal-emoji').textContent = isWin ? '🏆' : currentChar.emoji;
  document.getElementById('modal-title').textContent = isWin ? '승리했습니다!' : `${currentChar.name}의 승리!`;
  document.getElementById('modal-desc').textContent = customDesc || (isWin ? currentChar.quotes.lose : currentChar.quotes.win);
  setTimeout(() => {
    document.getElementById('result-modal').classList.add('show');
  }, 450);
}

// ==================== 1. 오목 (15x15) ====================
const OMOK_SIZE = 15;
let omokBoard = [];
let omokTurn = 1; // 1: 플레이어(흑), 2: 상대(백)
let omokPreview = null;
let omokLastMove = null;

function initOmok() {
  omokBoard = Array.from({ length: OMOK_SIZE }, () => Array(OMOK_SIZE).fill(0));
  omokTurn = 1;
  omokPreview = null;
  omokLastMove = null;
  updateOmokUI();
  drawOmok();
}

function updateOmokUI() {
  document.getElementById('turn-indicator').textContent = omokTurn === 1 ? '⚫ 내 차례 (흑돌)' : `⚪ ${currentChar.name} 고민 중...`;
  document.getElementById('score-indicator').textContent = '15×15 표준 오목판';
  const bar = document.getElementById('action-bar');
  bar.innerHTML = '';
  if (omokTurn === 1 && omokPreview) {
    const btn = document.createElement('button');
    btn.className = 'btn-action btn-confirm';
    btn.textContent = '✅ 이 자리에 착수 확정';
    btn.onclick = () => confirmOmokMove(omokPreview.r, omokPreview.c);
    bar.appendChild(btn);
  }
}

function drawOmok() {
  const W = canvas.width;
  const pad = 32;
  const cell = (W - pad * 2) / (OMOK_SIZE - 1);

  ctx.fillStyle = '#deb887';
  ctx.fillRect(0, 0, W, W);

  // 격자선
  ctx.strokeStyle = '#5c4033';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < OMOK_SIZE; i++) {
    const pos = pad + i * cell;
    ctx.beginPath(); ctx.moveTo(pad, pos); ctx.lineTo(W - pad, pos); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pos, pad); ctx.lineTo(pos, W - pad); ctx.stroke();
  }

  // 화점
  const stars = [3, 7, 11];
  ctx.fillStyle = '#3e2723';
  stars.forEach(r => stars.forEach(c => {
    ctx.beginPath();
    ctx.arc(pad + c * cell, pad + r * cell, 4, 0, Math.PI * 2);
    ctx.fill();
  }));

  // 바둑돌
  for (let r = 0; r < OMOK_SIZE; r++) {
    for (let c = 0; c < OMOK_SIZE; c++) {
      if (omokBoard[r][c] !== 0) {
        drawStone(pad + c * cell, pad + r * cell, cell * 0.43, omokBoard[r][c] === 1);
      }
    }
  }

  // 마지막 수 표시
  if (omokLastMove) {
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(pad + omokLastMove.c * cell, pad + omokLastMove.r * cell, cell * 0.2, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 조준 미리보기
  if (omokTurn === 1 && omokPreview) {
    const px = pad + omokPreview.c * cell;
    const py = pad + omokPreview.r * cell;
    ctx.save();
    ctx.globalAlpha = 0.55;
    drawStone(px, py, cell * 0.43, true);
    ctx.restore();
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 3;
    ctx.strokeRect(px - cell * 0.46, py - cell * 0.46, cell * 0.92, cell * 0.92);
  }
}

    grad.add
