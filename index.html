<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>바둑판 만능 대결: 냥이부터 슈퍼 AI까지! - 무료 웹 알까기·바둑·오목 게임</title>
<meta name="description" content="고양이, 고라니, 3살 아기부터 20년차 고수, 천재 고릴라, 슈퍼 AI까지 10종의 개성 만점 캐릭터와 알까기, 9x9 미니바둑, 15x15 오목 대결을 즐길 수 있는 무료 웹 보드게임입니다.">
<meta name="keywords" content="바둑판 만능 대결, 무료 오목 게임, 웹 알까기 게임, 미니바둑, 냥이 오목, AI 오목 대결">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 45%, #1e293b 100%);
    color: #f8fafc;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow-x: hidden;
  }
  .screen {
    width: 100%;
    max-width: 720px;
    display: none;
    flex-direction: column;
    align-items: center;
    animation: fadeIn 0.25s ease;
  }
  .screen.active {
    display: flex;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 메인 타이틀 화면 */
  .main-title {
    font-size: clamp(26px, 5.5vw, 42px);
    font-weight: 900;
    text-align: center;
    background: linear-gradient(to right, #fde047, #fb923c, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 20px rgba(251, 146, 60, 0.25);
    margin-bottom: 6px;
  }
  .main-sub {
    color: #cbd5e1;
    font-size: clamp(13px, 2.6vw, 16px);
    margin-bottom: 28px;
    text-align: center;
  }
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    width: 100%;
    margin-bottom: 20px;
  }
  @media (max-width: 560px) {
    .mode-grid {
      grid-template-columns: 1fr;
    }
  }
  .mode-card {
    background: rgba(30, 41, 59, 0.85);
    border: 2px solid rgba(148, 163, 184, 0.25);
    border-radius: 20px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.18s ease;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
  }
  .mode-card:hover, .mode-card:active {
    transform: translateY(-4px) scale(1.02);
    border-color: #facc15;
    background: rgba(51, 65, 85, 0.95);
    box-shadow: 0 14px 30px rgba(250, 204, 21, 0.25);
  }
  .mode-icon {
    font-size: 46px;
    margin-bottom: 10px;
    display: block;
    pointer-events: none;
  }
  .mode-name {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 6px;
    pointer-events: none;
  }
  .mode-desc {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.4;
    pointer-events: none;
  }

  /* 상대 선택 화면 */
  .header-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .btn-small {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #f8fafc;
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.15s;
  }
  .btn-small:active {
    transform: scale(0.95);
  }
  .tier-section {
    width: 100%;
    background: rgba(15, 23, 42, 0.65);
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .tier-label {
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tier-1 { color: #4ade80; }
  .tier-2 { color: #38bdf8; }
  .tier-3 { color: #facc15; }
  .tier-4 { color: #fb923c; }
  .tier-5 { color: #f43f5e; }

  .char-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .char-btn {
    flex: 1 1 140px;
    background: #1e293b;
    border: 1.5px solid #334155;
    border-radius: 12px;
    padding: 10px 12px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    touch-action: manipulation;
    text-align: left;
    transition: all 0.15s;
  }
  .char-btn:hover, .char-btn:active {
    border-color: #fbbf24;
    background: #283548;
    transform: translateY(-2px);
  }
  .char-emoji {
    font-size: 28px;
    pointer-events: none;
  }
  .char-info-name {
    font-size: 14px;
    font-weight: 800;
    pointer-events: none;
  }
  .char-info-quote {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 2px;
    pointer-events: none;
  }

  /* 게임 플레이 화면 */
  .opponent-panel {
    width: 100%;
    background: rgba(15, 23, 42, 0.8);
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .opp-avatar {
    font-size: 38px;
    background: rgba(255,255,255,0.08);
    width: 54px;
    height: 54px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .opp-details {
    flex: 1;
    min-width: 0;
  }
  .opp-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .opp-name {
    font-weight: 800;
    font-size: 15px;
  }
  .opp-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(251, 191, 36, 0.2);
    color: #fde047;
    font-weight: 700;
  }
  .speech-bubble {
    background: #334155;
    color: #f8fafc;
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.35;
    position: relative;
    word-break: keep-all;
  }

  .status-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(30, 41, 59, 0.85);
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .canvas-container {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 1 / 1;
    background: #deb887;
    border-radius: 14px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
  }

  .action-bar {
    width: 100%;
    max-width: 480px;
    display: flex;
    gap: 8px;
    margin-top: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn-action {
    flex: 1;
    min-width: 100px;
    padding: 11px 14px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
    color: #fff;
    background: #3b82f6;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    transition: 0.15s;
  }
  .btn-action:active {
    transform: scale(0.96);
  }
  .btn-confirm {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
  }
  .btn-secondary {
    background: #475569;
    box-shadow: none;
  }

  /* 결과 모달 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(4px);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.show {
    display: flex;
  }
  .modal-box {
    background: #1e293b;
    border: 2px solid #facc15;
    border-radius: 20px;
    padding: 24px 20px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  }
  .modal-emoji {
    font-size: 54px;
    margin-bottom: 8px;
  }
  .modal-title {
    font-size: 24px;
    font-weight: 900;
    color: #fde047;
    margin-bottom: 8px;
  }
  .modal-desc {
    font-size: 14px;
    color: #cbd5e1;
    margin-bottom: 18px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<!-- 1. 메인 시작 화면 -->
<div id="screen-home" class="screen active">
  <h1 class="main-title">🏆 바둑판 만능 대결</h1>
  <p class="main-sub">냥이부터 슈퍼 AI까지! 원하는 종목을 선택해 승부를 겨뤄보세요.</p>

  <div class="mode-grid">
    <button type="button" class="mode-card" onclick="selectGameMode('alkkagi')">
      <span class="mode-icon">🎯</span>
      <div class="mode-name">알까기</div>
      <div class="mode-desc">돌을 튕겨 상대 바둑돌을 모두 판 밖으로 날려버리세요!</div>
    </button>
    <button type="button" class="mode-card" onclick="selectGameMode('baduk')">
      <span class="mode-icon">⚫⚪</span>
      <div class="mode-name">바둑 (9×9)</div>
      <div class="mode-desc">상대 돌을 둘러싸 따내고 더 많은 집을 차지하세요!</div>
    </button>
    <button type="button" class="mode-card" onclick="selectGameMode('omok')">
      <span
