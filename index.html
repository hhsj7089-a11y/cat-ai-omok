let currentMode='omok', currentChar=CHARACTERS[0], gameEnded=false;
const canvas=document.getElementById('boardCanvas'), ctx=canvas.getContext('2d');
let audioCtx=null;

function playSound(type){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const now=audioCtx.currentTime, osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if(type==='stone'){osc.type='triangle';osc.frequency.setValueAtTime(320,now);osc.frequency.exponentialRampToValueAtTime(95,now+.08);gain.gain.setValueAtTime(.25,now);gain.gain.exponentialRampToValueAtTime(.001,now+.08);osc.start(now);osc.stop(now+.08)}
    else if(type==='hit'){osc.type='sine';osc.frequency.setValueAtTime(580,now);osc.frequency.exponentialRampToValueAtTime(140,now+.1);gain.gain.setValueAtTime(.28,now);gain.gain.exponentialRampToValueAtTime(.001,now+.1);osc.start(now);osc.stop(now+.1)}
    else if(type==='fall'){osc.type='sawtooth';osc.frequency.setValueAtTime(260,now);osc.frequency.linearRampToValueAtTime(75,now+.28);gain.gain.setValueAtTime(.16,now);gain.gain.exponentialRampToValueAtTime(.001,now+.28);osc.start(now);osc.stop(now+.28)}
    else if(type==='win'){[523,659,784,1046].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,now+i*.1);g.gain.setValueAtTime(.16,now+i*.1);g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25);o.connect(g);g.connect(audioCtx.destination);o.start(now+i*.1);o.stop(now+i*.1+.25)})}
    else if(type==='lose'){[330,294,262,196].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,now+i*.12);g.gain.setValueAtTime(.12,now+i*.12);g.gain.exponentialRampToValueAtTime(.001,now+i*.12+.25);o.connect(g);g.connect(audioCtx.destination);o.start(now+i*.12);o.stop(now+i*.12+.25)})}
  }catch(e){}
}

function goScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function selectGameMode(mode){
  currentMode=mode;
  const modeNames={alkkagi:'🎯 알까기',baduk:'⚫⚪ 바둑 (9×9)',omok:'⭕❌ 오목 (15×15)'};
  document.getElementById('selected-mode-badge').textContent=`종목: ${modeNames[mode]}`;
  renderCharacterSelect();
  goScreen('screen-select');
}

function drawStone(x,y,r,isBlack){
  ctx.beginPath();ctx.arc(x+2,y+2,r,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.28)';ctx.fill();
  const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
  if(isBlack){g.addColorStop(0,'#475569');g.addColorStop(1,'#0f172a')}else{g.addColorStop(0,'#fff');g.addColorStop(1,'#cbd5e1')}
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
}

// 1. 오목
const OMOK_SIZE=15; let omokBoard=[],omokTurn=1,omokPreview=null,omokLastMove=null;
function initOmok(){omokBoard=Array.from({length:OMOK_SIZE},()=>Array(OMOK_SIZE).fill(0));omokTurn=1;omokPreview=null;omokLastMove=null;updateOmokUI();drawOmok()}
function updateOmokUI(){
  document.getElementById('turn-indicator').textContent=omokTurn===1?'⚫ 내 차례 (흑돌)':`⚪ ${currentChar.name} 고민 중...`;
  document.getElementById('score-indicator').textContent='15×15 표준 오목판';
  const bar=document.getElementById('action-bar'); bar.innerHTML='';
  if(omokTurn===1&&omokPreview){
    const btn=document.createElement('button');btn.type='button';btn.className='btn-action btn-confirm';btn.textContent='✅ 이 자리에 착수 확정';
    btn.addEventListener('click',()=>confirmOmokMove(omokPreview.r,omokPreview.c)); bar.appendChild(btn);
  }
}
function drawOmok(){
  const W=canvas.width,pad=32,cell=(W-pad*2)/(OMOK_SIZE-1);
  ctx.fillStyle='#deb887';ctx.fillRect(0,0,W,W);ctx.strokeStyle='#5c4033';ctx.lineWidth=1.5;
  for(let i=0;i<OMOK_SIZE;i++){const p=pad+i*cell;ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(W-pad,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,pad);ctx.lineTo(p,W-pad);ctx.stroke()}
  ctx.fillStyle='#3e2723';[3,7,11].forEach(r=>[3,7,11].forEach(c=>{ctx.beginPath();ctx.arc(pad+c*cell,pad+r*cell,4,0,Math.PI*2);ctx.fill()}));
  for(let r=0;r<OMOK_SIZE;r++)for(let c=0;c<OMOK_SIZE;c++)if(omokBoard[r][c]!==0)drawStone(pad+c*cell,pad+r*cell,cell*.43,omokBoard[r][c]===1);
  if(omokLastMove){ctx.strokeStyle='#ef4444';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(pad+omokLastMove.c*cell,pad+omokLastMove.r*cell,cell*.2,0,Math.PI*2);ctx.stroke()}
  if(omokTurn===1&&omokPreview){const px=pad+omokPreview.c*cell,py=pad+omokPreview.r*cell;ctx.save();ctx.globalAlpha=.55;drawStone(px,py,cell*.43,true);ctx.restore();ctx.strokeStyle='#10b981';ctx.lineWidth=3;ctx.strokeRect(px-cell*.46,py-cell*.46,cell*.92,cell*.92)}
}
function handleOmokClick(x,y){
  if(gameEnded||omokTurn!==1)return;
  const W=canvas.width,pad=32,cell=(W-pad*2)/(OMOK_SIZE-1),c=Math.round((x-pad)/cell),r=Math.round((y-pad)/cell);
  if(r<0||r>=OMOK_SIZE||c<0||c>=OMOK_SIZE||omokBoard[r][c]!==0)return;
  if(omokPreview&&omokPreview.r===r&&omokPreview.c===c)confirmOmokMove(r,c);
  else{omokPreview={r,c};updateOmokUI();drawOmok()}
}
function confirmOmokMove(r,c){
  if(omokBoard[r][c]!==0||omokTurn!==1)return;
  omokBoard[r][c]=1;omokLastMove={r,c};omokPreview=null;playSound('stone');drawOmok();
  if(checkOmokWin(omokBoard,r,c,1)){showResult(true,`5목을 완성해 ${currentChar.name}에게 승리했습니다!`);return}
  if(omokBoard.flat().every(v=>v!==0)){showResult(true,'무승부입니다! 판이 가득 찼습니다.');return}
  omokTurn=2;updateOmokUI();setTimeout(aiOmokTurn,420);
}
function checkOmokWin(b,r,c,p){
  for(let[dr,dc]of[[1,0],[0,1],[1,1],[1,-1]]){
    let cnt=1;
    for(let s=1;s<5;s++){const nr=r+dr*s,nc=c+dc*s;if(nr>=0&&nr<OMOK_SIZE&&nc>=0&&nc<OMOK_SIZE&&b[nr][nc]===p)cnt++;else break}
    for(let s=1;s<5;s++){const nr=r-dr*s,nc=c-dc*s;if(nr>=0&&nr<OMOK_SIZE&&nc>=0&&nc<OMOK_SIZE&&b[nr][nc]===p)cnt++;else break}
    if(cnt>=5)return true;
  }
  return false;
}
function evalOmok(b,r,c,p){
  let sc=0;
  for(let[dr,dc]of[[1,0],[0,1],[1,1],[1,-1]]){
    let cnt=1,op=0,nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<OMOK_SIZE&&nc>=0&&nc<OMOK_SIZE&&b[nr][nc]===p){cnt++;nr+=dr;nc+=dc}
    if(nr>=0&&nr<OMOK_SIZE&&nc>=0&&nc<OMOK_SIZE&&b[nr][nc]===0)op++;
    nr=r-dr;nc=c-dc;
    while(nr>=0&&nr<OMOK_SIZE&&nc>=0&&nc<OMOK_SIZE&&b[nr][nc]===p){cnt++;nr-=dr;nc-=dc}
    if(nr>=0&&nr<OMOK_SIZE&&nc>=0&&nc<OMOK_SIZE&&b[nr][nc]===0)op++;
    if(cnt>=5)sc+=100000;else if(cnt===4&&op===2)sc+=15000;else if(cnt===4&&op===1)sc+=3000;else if(cnt===3&&op===2)sc+=1200;else if(cnt===3&&op===1)sc+=200;else if(cnt===2&&op===2)sc+=80;else sc+=cnt*10;
  }
  return sc;
}
function aiOmokTurn(){
  if(gameEnded)return;
  const tier=currentChar.tier,empties=[];
  for(let r=0;r<OMOK_SIZE;r++)for(let c=0;c<OMOK_SIZE;c++)if(omokBoard[r][c]===0)empties.push({r,c});
  if(!empties.length)return;
  let chosen=empties[0];
  if(tier===1)chosen=empties[Math.floor(Math.random()*empties.length)];
  else{
    let cand=empties.map(cell=>{
      const atk=evalOmok(omokBoard,cell.r,cell.c,2),def=evalOmok(omokBoard,cell.r,cell.c,1),cb=14-(Math.abs(cell.r-7)+Math.abs(cell.c-7));
      let tot=tier===2?atk*1.2+(def>=3000?def*.7:def*.15)+Math.random()*120+cb:tier===3?atk*1.1+def*1.05+Math.random()*45+cb:tier===4?atk*1.25+def*1.2+Math.random()*12+cb*2:atk*1.35+def*1.3+cb*3;
      return{...cell,tot};
    });
    cand.sort((a,b)=>b.tot-a.tot);chosen=cand[0];
  }
  omokBoard[chosen.r][chosen.c]=2;omokLastMove={r:chosen.r,c:chosen.c};playSound('stone');setSpeech(randomQuote(currentChar.quotes.move));drawOmok();
  if(checkOmokWin(omokBoard,chosen.r,chosen.c,2)){showResult(false,`${currentChar.name}이(가) 먼저 5목을 완성했습니다!`);return}
  omokTurn=1;updateOmokUI();
}

// 2. 바둑
const BADUK_SIZE=9;let badukBoard=[],badukTurn=1,badukPreview=null,badukLastMove=null,capP=0,capAI=0,passes=0;
function initBaduk(){badukBoard=Array.from({length:BADUK_SIZE},()=>Array(BADUK_SIZE).fill(0));badukTurn=1;badukPreview=null;badukLastMove=null;capP=0;capAI=0;passes=0;updateBadukUI();drawBaduk()}
function updateBadukUI(){
  document.getElementById('turn-indicator').textContent=badukTurn===1?'⚫ 내 차례 (흑돌)':`⚪ ${currentChar.name} 수읽기 중...`;
  document.getElementById('score-indicator').textContent=`따낸 돌: 나 ${capP} vs 상대 ${capAI}`;
  const bar=document.getElementById('action-bar');bar.innerHTML='';
  if(badukTurn===1){
    if(badukPreview){const b=document.createElement('button');b.type='button';b.className='btn-action btn-confirm';b.textContent='✅ 착수 확정';b.addEventListener('click',()=>confirmBadukMove(badukPreview.r,badukPreview.c));bar.appendChild(b)}
    const p=document.createElement('button');p.type='button';p.className='btn-action btn-secondary';p.textContent='⏭️ 패스';p.addEventListener('click',playerBadukPass);bar.appendChild(p);
    const s=document.createElement('button');s.type='button';s.className='btn-action';s.textContent='🏳️ 계가하기';s.addEventListener('click',finishBadukByScore);bar.appendChild(s);
  }
}
function drawBaduk(){
  const W=canvas.width,pad=48,cell=(W-pad*2)/(BADUK_SIZE-1);
  ctx.fillStyle='#e0b370';ctx.fillRect(0,0,W,W);ctx.strokeStyle='#4a3219';ctx.lineWidth=2;
  for(let i=0;i<BADUK_SIZE;i++){const p=pad+i*cell;ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(W-pad,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,pad);ctx.lineTo(p,W-pad);ctx.stroke()}
  [[2,2],[2,6],[4,4],[6,2],[6,6]].forEach(([r,c])=>{ctx.beginPath();ctx.arc(pad+c*cell,pad+r*cell,4.5,0,Math.PI*2);ctx.fillStyle='#3e2723';ctx.fill()});
  for(let r=0;r<BADUK_SIZE;r++)for(let c=0;c<BADUK_SIZE;c++)if(badukBoard[r][c]!==0)drawStone(pad+c*cell,pad+r*cell,cell*.44,badukBoard[r][c]===1);
  if(badukLastMove){ctx.strokeStyle='#ef4444';ctx.lineWidth=3;ctx.beginPath();ctx.arc(pad+badukLastMove.c*cell,pad+badukLastMove.r*cell,cell*.18,0,Math.PI*2);ctx.stroke()}
  if(badukTurn===1&&badukPreview){ctx.save();ctx.globalAlpha=.55;drawStone(pad+badukPreview.c*cell,pad+badukPreview.r*cell,cell*.44,true);ctx.restore()}
}
function getGrp(b,r,c){
  const col=b[r][c],vis=new Set([`${r},${c}`]),lib=new Set(),st=[],stk=[[r,c]];
  while(stk.length){const[cr,cc]=stk.pop();st.push([cr,cc]);for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const nr=cr+dr,nc=cc+dc;if(nr<0||nr>=BADUK_SIZE||nc<0||nc>=BADUK_SIZE)continue;if(b[nr][nc]===0)lib.add(`${nr},${nc}`);else if(b[nr][nc]===col&&!vis.has(`${nr},${nc}`)){vis.add(`${nr},${nc}`);stk.push([nr,nc])}}}
  return{stones:st,liberties:lib.size};
}
function tryPlaceBaduk(b,r,c,p){
  if(b[r][c]!==0)return null;
  const cp=b.map(row=>[...row]);cp[r][c]=p;const opp=p===1?2:1;let cap=0;
  for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<BADUK_SIZE&&nc>=0&&nc<BADUK_SIZE&&cp[nr][nc]===opp){const g=getGrp(cp,nr,nc);if(g.liberties===0)g.stones.forEach(([sr,sc])=>{cp[sr][sc]=0;cap++})}}
  const my=getGrp(cp,r,c);if(my.liberties===0)return null;
  return{board:cp,captured:cap,liberties:my.liberties};
}
function handleBadukClick(x,y){
  if(gameEnded||badukTurn!==1)return;
  const W=canvas.width,pad=48,cell=(W-pad*2)/(BADUK_SIZE-1),c=Math.round((x-pad)/cell),r=Math.round((y-pad)/cell);
  if(r<0||r>=BADUK_SIZE||c<0||c>=BADUK_SIZE||!tryPlaceBaduk(badukBoard,r,c,1))return;
  if(badukPreview&&badukPreview.r===r&&badukPreview.c===c)confirmBadukMove(r,c);
  else{badukPreview={r,c};updateBadukUI();drawBaduk()}
}
function confirmBadukMove(r,c){
  const res=tryPlaceBaduk(badukBoard,r,c,1);if(!res)return;
  badukBoard=res.board;capP+=res.captured;badukLastMove={r,c};badukPreview=null;passes=0;playSound('stone');drawBaduk();
  badukTurn=2;updateBadukUI();setTimeout(aiBadukTurn,450);
}
function playerBadukPass(){
  if(gameEnded||badukTurn!==1)return;
  badukPreview=null;passes++;if(passes>=2){finishBadukByScore();return}
  setSpeech('패스하셨군요. 제가 이어서 두겠습니다!');badukTurn=2;updateBadukUI();setTimeout(aiBadukTurn,450);
}
function aiBadukTurn(){
  if(gameEnded)return;
  const tier=currentChar.tier,moves=[];
  for(let r=0;r<BADUK_SIZE;r++)for(let c=0;c<BADUK_SIZE;c++){
    const res=tryPlaceBaduk(badukBoard,r,c,2);
    if(res){
      let own=0;for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<BADUK_SIZE&&nc>=0&&nc<BADUK_SIZE&&badukBoard[nr][nc]===2)own++}
      let sc=res.captured*40+res.liberties*4+(8-(Math.abs(r-4)+Math.abs(c-4)))*2-(own===4?30:0);
      moves.push({r,c,res,sc});
    }
  }
  if(!moves.length){passes++;if(passes>=2){finishBadukByScore();return}badukTurn=1;updateBadukUI();return}
  let chosen=tier===1?moves[Math.floor(Math.random()*moves.length)]:moves.sort((a,b)=>(b.sc+Math.random()*(6-tier)*12)-(a.sc+Math.random()*(6-tier)*12))[0];
  badukBoard=chosen.res.board;capAI+=chosen.res.captured;badukLastMove={r:chosen.r,c:chosen.c};passes=0;playSound('stone');setSpeech(randomQuote(currentChar.quotes.move));drawBaduk();
  badukTurn=1;updateBadukUI();
}
function finishBadukByScore(){
  let bSc=capP,wSc=capAI+5.5,vis=Array.from({length:BADUK_SIZE},()=>Array(BADUK_SIZE).fill(false));
  for(let r=0;r<BADUK_SIZE;r++)for(let c=0;c<BADUK_SIZE;c++){
    if(badukBoard[r][c]===1)bSc++;else if(badukBoard[r][c]===2)wSc++;
    else if(!vis[r][c]){
      const q=[[r,c]];vis[r][c]=true;let area=0,tB=false,tW=false;
      while(q.length){const[cr,cc]=q.pop();area++;for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const nr=cr+dr,nc=cc+dc;if(nr<0||nr>=BADUK_SIZE||nc<0||nc>=BADUK_SIZE)continue;if(badukBoard[nr][nc]===1)tB=true;else if(badukBoard[nr][nc]===2)tW=true;else if(!vis[nr][nc]){vis[nr][nc]=true;q.push([nr,nc])}}}
      if(tB&&!tW)bSc+=area;else if(tW&&!tB)wSc+=area;
    }
  }
  const win=bSc>wSc;showResult(win,`계가 결과 — 흑(나): ${bSc}집 vs 백(상대+덤): ${wSc}집 (${Math.abs(bSc-wSc).toFixed(1)}집 차 ${win?'승':'패'})`);
}

// 3. 알까기
let stones=[],alkkagiTurn=1,dragStone=null,dragPos=null,alkkagiAnimId=null;
function initAlkkagi(){
  if(alkkagiAnimId)cancelAnimationFrame(alkkagiAnimId);
  stones=[];const W=canvas.width,cnt=6,sp=(W-160)/(cnt-1);
  for(let i=0;i<cnt;i++){const x=80+i*sp;stones.push({x,y:105,vx:0,vy:0,r:22,owner:2});stones.push({x,y:W-105,vx:0,vy:0,r:22,owner:1})}
  alkkagiTurn=1;dragStone=null;dragPos=null;updateAlkkagiUI();drawAlkkagi();
}
function updateAlkkagiUI(){
  const my=stones.filter(s=>s.owner===1).length,opp=stones.filter(s=>s.owner===2).length;
  document.getElementById('score-indicator').textContent=`남은 돌: 나 ${my} vs 상대 ${opp}`;
  document.getElementById('turn-indicator').textContent=alkkagiTurn===1?'⚫ 내 차례: 돌을 뒤로 당겨 쏘세요!':alkkagiTurn===2?`⚪ ${currentChar.name} 조준 중...`:'💥 바둑돌 이동 중!';
  document.getElementById('action-bar').innerHTML='';
}
function drawAlkkagi(){
  const W=canvas.width,m=36;ctx.fillStyle='#d9a76a';ctx.fillRect(0,0,W,W);ctx.strokeStyle='#78350f';ctx.lineWidth=4;ctx.strokeRect(m,m,W-m*2,W-m*2);
  ctx.strokeStyle='rgba(92,64,51,.35)';ctx.lineWidth=1.5;const st=(W-m*2)/8;
  for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo(m+i*st,m);ctx.lineTo(m+i*st,W-m);ctx.stroke();ctx.beginPath();ctx.moveTo(m,m+i*st);ctx.lineTo(W-m,m+i*st);ctx.stroke()}
  if(alkkagiTurn===1&&dragStone&&dragPos){
    const dx=dragStone.x-dragPos.x,dy=dragStone.y-dragPos.y,dist=Math.min(Math.hypot(dx,dy),180),ang=Math.atan2(dy,dx);
    ctx.strokeStyle='rgba(239,68,68,.7)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(dragStone.x,dragStone.y);ctx.lineTo(dragPos.x,dragPos.y);ctx.stroke();
    ctx.save();ctx.setLineDash([8,8]);ctx.strokeStyle='#10b981';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(dragStone.x,dragStone.y);ctx.lineTo(dragStone.x+Math.cos(ang)*dist*1.6,dragStone.y+Math.sin(ang)*dist*1.6);ctx.stroke();ctx.restore();
  }
  for(let s of stones){
    drawStone(s.x,s.y,s.r,s.owner===1);
    if(alkkagiTurn===1&&s.owner===1&&!dragStone){ctx.strokeStyle='rgba(16,185,129,.65)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(s.x,s.y,s.r+4,0,Math.PI*2);ctx.stroke()}
  }
}
function handleAlkkagiDown(x,y){if(gameEnded||alkkagiTurn!==1)return;for(let s of stones)if(s.owner===1&&Math.hypot(x-s.x,y-s.y)<=s.r+14){dragStone=s;dragPos={x,y};drawAlkkagi();break}}
function handleAlkkagiMove(x,y){if(!dragStone)return;dragPos={x,y};drawAlkkagi()}
function handleAlkkagiUp(){
  if(!dragStone||!dragPos)return;
  const dx=dragStone.x-dragPos.x,dy=dragStone.y-dragPos.y,dist=Math.hypot(dx,dy);
  if(dist>15){const p=Math.min(dist,180)*.14,a=Math.atan2(dy,dx);dragStone.vx=Math.cos(a)*p;dragStone.vy=Math.sin(a)*p;dragStone=null;dragPos=null;startAlkkagiPhysics(2)}
  else{dragStone=null;dragPos=null;drawAlkkagi()}
}
function startAlkkagiPhysics(next){
  alkkagiTurn=0;updateAlkkagiUI();const W=canvas.width,m=36;
  function step(){
    let mv=false;
    for(let s of stones){s.x+=s.vx;s.y+=s.vy;s.vx*=.965;s.vy*=.965;if(Math.hypot(s.vx,s.vy)<.15){s.vx=0;s.vy=0}else mv=true}
    for(let i=0;i<stones.length;i++)for(let j=i+1;j<stones.length;j++){
      const a=stones[i],b=stones[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),md=a.r+b.r;
      if(d<md&&d>0){playSound('hit');const nx=dx/d,ny=dy/d,ov=(md-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;const dot=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(dot<0){const imp=dot*.92;a.vx+=imp*nx;a.vy+=imp*ny;b.vx-=imp*nx;b.vy-=imp*ny}}
    }
    for(let i=stones.length-1;i>=0;i--){const s=stones[i];if(s.x<m||s.x>W-m||s.y<m||s.y>W-m){playSound('fall');setSpeech(currentChar.quotes.hit);stones.splice(i,1)}}
    drawAlkkagi();
    if(mv)alkkagiAnimId=requestAnimationFrame(step);
    else{
      const my=stones.filter(s=>s.owner===1).length,opp=stones.filter(s=>s.owner===2).length;
      if(opp===0){showResult(true,`${currentChar.name}의 바둑돌을 모두 판 밖으로 날려버렸습니다!`);return}
      if(my===0){showResult(false,'내 바둑돌이 모두 판 밖으로 떨어졌습니다!');return}
      alkkagiTurn=next;updateAlkkagiUI();drawAlkkagi();if(next===2)setTimeout(aiAlkkagiTurn,600);
    }
  }
  alkkagiAnimId=requestAnimationFrame(step);
}
function aiAlkkagiTurn(){
  if(gameEnded)return;
  const my=stones.filter(s=>s.owner===2),tg=stones.filter(s=>s.owner===1);if(!my.length||!tg.length)return;
  const tier=currentChar.tier;let bs=my[0],bt=tg[0],bd=Infinity;
  for(let s of my)for(let t of tg){const d=Math.hypot(t.x-s.x,t.y-s.y);if(d<bd){bd=d;bs=s;bt=t}}
  let ang=Math.atan2(bt.y-bs.y,bt.x-bs.x)+((Math.random()-.5)*[.65,.35,.16,.05,.008][tier-1]);
  const pw=tier===1?8+Math.random()*14:Math.min(24,Math.max(13,bd*.055+tier*1.4));
  bs.vx=Math.cos(ang)*pw;bs.vy=Math.sin(ang)*pw;setSpeech(randomQuote(currentChar.quotes.move));startAlkkagiPhysics(1);
}

function getCoords(e){const r=canvas.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;return{x:((cx-r.left)/r.width)*canvas.width,y:((cy-r.top)/r.height)*canvas.height}}
canvas.addEventListener('mousedown',e=>{const{x,y}=getCoords(e);if(currentMode==='omok')handleOmokClick(x,y);else if(currentMode==='baduk')handleBadukClick(x,y);else handleAlkkagiDown(x,y)});
canvas.addEventListener('mousemove',e=>{if(currentMode==='alkkagi'){const{x,y}=getCoords(e);handleAlkkagiMove(x,y)}});
window.addEventListener('mouseup',()=>{if(currentMode==='alkkagi')handleAlkkagiUp()});
canvas.addEventListener('touchstart',e=>{e.preventDefault();const{x,y}=getCoords(e);if(currentMode==='omok')handleOmokClick(x,y);else if(currentMode==='baduk')handleBadukClick(x,y);else handleAlkkagiDown(x,y)},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(currentMode==='alkkagi'){const{x,y}=getCoords(e);handleAlkkagiMove(x,y)}},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(currentMode==='alkkagi')handleAlkkagiUp()},{passive:false});
